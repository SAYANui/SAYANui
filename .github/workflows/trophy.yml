name: Generate Trophies

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # <-- this is the actual fix: grants this workflow push rights
                              #     even if repo-level "Read and write permissions" wasn't set

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history, avoids shallow-clone push issues

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: SAYANui
          file: trophy.svg
          theme: onedark
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify file was created
        run: |
          if [ ! -f trophy.svg ]; then
            echo "ERROR: trophy.svg was not generated by the action."
            exit 1
          fi
          echo "trophy.svg generated successfully:"
          ls -la trophy.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trophy.svg [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
